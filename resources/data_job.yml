resources:
  jobs:
    high_garden_data_pipeline:
      name: high-garden-data-pipeline
      max_concurrent_runs: 1
      email_notifications:
        on_start: []
        on_success: []
        on_failure: []
        on_duration_warning_threshold_exceeded: []
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.ipynb
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/03_silver.ipynb
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_business_metrics
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ../notebooks/05_gold.ipynb
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_ml_features
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ../notebooks/06_gold_ml_features.ipynb
            base_parameters:
              catalog: ${var.catalog}
