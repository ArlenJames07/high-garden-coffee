resources:
  jobs:
    high_garden_data_pipeline:
      name: high-garden-data-pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_ingestion
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../notebooks/03_silver_transformation.py

        - task_key: gold_business_metrics
          depends_on:
            - task_key: silver_transformation
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../notebooks/05_gold_business_metrics.py

        - task_key: gold_ml_features
          depends_on:
            - task_key: silver_transformation
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../notebooks/06_gold_ml_features.py
