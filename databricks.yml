bundle:
  name: high-garden-coffee

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by notebooks and jobs
    default: high_garden

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: high_garden

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: high_garden_prod
